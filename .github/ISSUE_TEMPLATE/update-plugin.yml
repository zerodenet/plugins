name: Update a marketplace record / 更新插件资料
description: Propose exact publisher-supplied replacements for an existing product record. / 使用发布者提交的原始值更新已登记产品。
title: '[Plugin update] '
labels: ['plugin:update']
body:
  - type: markdown
    attributes:
      value: |
        Publish a public signed release whose immutable `marketplace-entry.json` contains the complete updated `listing`, then submit that asset URL here. Automation verifies source control and metadata, then commits the listing fields verbatim without a maintainer approval step. The marketplace does not translate, rewrite, infer, or enhance product metadata.
        请先发布一个公开签名版本，并在固定的 `marketplace-entry.json` 中携带完整更新后 `listing`，再提交该资产链接。自动化校验来源控制权和元数据后直接原样登记，无需管理员批准。市场不会翻译、改写、推断或美化产品资料。
  - type: input
    id: plugin
    attributes:
      label: Registered product ID / 已登记产品 ID
      placeholder: org.example.product
    validations:
      required: true
  - type: input
    id: metadata
    attributes:
      label: Immutable listing metadata URL / 固定资料清单链接
      description: The URL must identify exactly one public GitHub Release asset named marketplace-entry.json. / 必须是公开 GitHub Release 中唯一的 marketplace-entry.json 资产。
      placeholder: https://github.com/owner/plugin/releases/download/v1.1.0/marketplace-entry.json
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Update context / 更新说明
      description: Explain why the registered record changes. This text explains the update and is never displayed as product information. / 说明登记变更原因；此处文字仅说明更新原因，绝不会展示为产品资料。
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Publisher confirmation / 发布者确认
      options:
        - label: The listing contains the exact text and links that should be displayed, with no marketplace translation or rewriting. / listing 已包含应当展示的准确文字和链接，无需市场翻译或改写。
          required: true
