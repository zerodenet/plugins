name: Apply to the marketplace / 申请插件入驻
description: Request first-time marketplace admission. / 申请插件首次进入市场。
title: '[Plugin] '
labels: ['plugin:submission']
body:
  - type: markdown
    attributes:
      value: |
        Apply one product with a stable signed release. A product may contain one ZBoard target, one ZNet Sink target, or both. Single-host authors do not declare empty targets. After admission, publish Stable, RC and Dev releases only in the plugin repository.
        用一个正式签名版本申请一个产品；可以只支持 ZBoard、只支持 ZNet Sink，或同时提供两个目标。单宿主作者不用声明空目标。通过后，正式版、RC 与 Dev 版本只在插件仓库发布。不要提交源码、安装包或私钥。
        Automation validates this Issue and marks it in review. A maintainer approves by applying `status:accepted`; the Action then updates the marketplace directly without an admission pull request.
        自动化会校验当前 Issue 并标记为待审核；管理员添加 `status:accepted` 后，Action 直接更新市场，不另建入驻 PR。
  - type: checkboxes
    id: hosts
    attributes:
      label: Host targets / 宿主目标
      options:
        - label: ZBoard
        - label: ZNet Sink
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Product ID / 产品 ID
      placeholder: org.example.product
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Source repository / 源码仓库
      placeholder: https://github.com/owner/plugin
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Onboarding release and source commit / 入驻发行与源码提交
    validations:
      required: true
  - type: input
    id: metadata
    attributes:
      label: Onboarding metadata URL / 入驻发行元数据链接
      description: One immutable marketplace-entry.json generated from the signed host packages. It includes the onboarding listing and one or two target packages. / 提供由签名宿主包生成的固定 marketplace-entry.json，其中包含入驻登记和一到两个宿主目标。
      placeholder: https://github.com/owner/plugin/releases/download/v0.0.1/marketplace-entry.json
    validations:
      required: true
  - type: textarea
    id: publisher
    attributes:
      label: Publisher identity and public key / 发布者身份与公钥
      description: Include key ID, base64 Ed25519 public key and an independently verifiable ownership channel. Never include private keys. / 提供公钥 ID、Base64 Ed25519 公钥及可独立核实归属的渠道，严禁填写私钥。
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Capability ceiling and data / 能力上限与数据
      description: Declare the maximum host capabilities and UI surfaces this listing may use, plus migrations, retention and uninstall behavior. Expanding this boundary requires a marketplace update. / 声明条目允许使用的最大宿主能力和界面范围，以及迁移、数据保留与卸载行为；扩大边界时需要更新市场登记。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and maintenance / 验证与维护
      description: Link CI and list actual host/platform tests, license, maintainers and security contact. / 提供 CI 链接、实际宿主与平台测试、许可证、维护者及安全联系渠道。
    validations:
      required: true
