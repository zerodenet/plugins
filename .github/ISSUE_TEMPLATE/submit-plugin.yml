name: Register in the marketplace / 登记插件
description: Register a plugin for centralized discovery. / 登记插件以供集中发现。
title: '[Plugin] '
labels: ['plugin:submission']
body:
  - type: markdown
    attributes:
      value: |
        Register one product with a public signed release. A product may contain one ZBoard target, one ZNet Sink target, or both. Single-host authors do not declare empty targets. After registration, publish Stable, RC and Dev releases only in the plugin repository.
        用一个公开签名版本登记一个产品；可以只支持 ZBoard、只支持 ZNet Sink，或同时提供两个目标。单宿主作者不用声明空目标。登记后，正式版、RC 与 Dev 版本只在插件仓库发布。不要提交源码、安装包或私钥。
        Automation validates source ownership and metadata, then registers the listing automatically. No maintainer approval is required; hosts own permission confirmation.
        自动化校验来源归属和元数据后自动登记，无需管理员批准；权限确认由宿主负责。
  - type: checkboxes
    id: hosts
    attributes:
      label: Host targets / 宿主目标
      options:
        - label: ZBoard
        - label: ZNet Sink
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Product ID / 产品 ID
      placeholder: org.example.product
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Source repository / 源码仓库
      placeholder: https://github.com/owner/plugin
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Onboarding release and source commit / 入驻发行与源码提交
    validations:
      required: true
  - type: input
    id: metadata
    attributes:
      label: Onboarding metadata URL / 入驻发行元数据链接
      description: One immutable marketplace-entry.json generated from the signed host packages. It includes the onboarding listing and one or two target packages. / 提供由签名宿主包生成的固定 marketplace-entry.json，其中包含入驻登记和一到两个宿主目标。
      placeholder: https://github.com/owner/plugin/releases/download/v0.0.1/marketplace-entry.json
    validations:
      required: true
  - type: textarea
    id: publisher
    attributes:
      label: Publisher identity and public key / 发布者身份与公钥
      description: Include key ID, base64 Ed25519 public key and an independently verifiable ownership channel. Never include private keys. / 提供公钥 ID、Base64 Ed25519 公钥及可独立核实归属的渠道，严禁填写私钥。
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Declared permissions and data / 申请权限与数据
      description: Describe release permissions, UI and data behavior. Hosts handle support and user confirmation; changes require no market approval. / 说明版本申请权限、界面和数据行为；支持与用户确认由宿主处理，变更无需市场批准。
    validations:
      required: false
  - type: textarea
    id: validation
    attributes:
      label: Validation and maintenance / 验证与维护
      description: Link CI and list actual host/platform tests, license, maintainers and security contact. / 提供 CI 链接、实际宿主与平台测试、许可证、维护者及安全联系渠道。
    validations:
      required: false
