name: Apply to the marketplace / 申请插件入驻
description: Request first-time marketplace admission. / 申请插件首次进入市场。
title: '[Plugin] '
labels: ['plugin:submission']
body:
  - type: markdown
    attributes:
      value: |
        Apply once with a stable signed release. After admission, publish Stable, RC and Dev versions only in the plugin repository; do not open a marketplace issue for each version.
        Keep basic information in the repository root marketplace.json; hosts read it directly instead of copying it into this directory.
        使用一个正式签名版本申请一次入驻。通过后，正式版、RC 与 Dev 版本只在插件仓库发布，不要为每个版本重复提交市场 Issue。基础资料保存在仓库根目录 marketplace.json，由宿主直接读取。不要提交源码、安装包或私钥。
  - type: dropdown
    id: host
    attributes:
      label: Host / 宿主
      options: [zboard, znet-sink]
    validations:
      required: true
  - type: input
    id: plugin
    attributes:
      label: Plugin ID / 插件 ID
      placeholder: zboard.example
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Source repository / 源码仓库
      placeholder: https://github.com/owner/plugin
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Onboarding release and source commit / 入驻发行与源码提交
    validations:
      required: true
  - type: input
    id: metadata
    attributes:
      label: Onboarding metadata URL / 入驻发行元数据链接
      description: One immutable stable GitHub Release asset used for admission review. Future versions remain in your repository. / 提供一个用于准入审核的正式版固定产物；后续版本由你的仓库维护。
      placeholder: https://github.com/owner/plugin/releases/download/v0.0.1/marketplace-entry.json
    validations:
      required: true
  - type: textarea
    id: publisher
    attributes:
      label: Publisher identity and public key / 发布者身份与公钥
      description: Include key ID, base64 Ed25519 public key and an independently verifiable ownership channel. Never include private keys. / 提供公钥 ID、Base64 Ed25519 公钥及可独立核实归属的渠道，严禁填写私钥。
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Capability ceiling and data / 能力上限与数据
      description: Declare the maximum host capabilities and UI surfaces this listing may use, plus migrations, retention and uninstall behavior. Expanding this boundary requires a marketplace update. / 声明条目允许使用的最大宿主能力和界面范围，以及迁移、数据保留与卸载行为；扩大边界时需要更新市场登记。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and maintenance / 验证与维护
      description: Link CI and list actual host/platform tests, license, maintainers and security contact. / 提供 CI 链接、实际宿主与平台测试、许可证、维护者及安全联系渠道。
    validations:
      required: true
