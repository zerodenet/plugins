name: Plugin checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  oauth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: zboard/oauth/go.mod
          cache-dependency-path: zboard/oauth/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check OAuth plugin
        run: sh scripts/check.sh
      - name: Verify module lockfiles
        working-directory: zboard/oauth
        env:
          GOWORK: 'off'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
